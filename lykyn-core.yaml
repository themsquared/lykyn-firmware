    name: "Inlet Fan Manual"
    web_server:
      sorting_group_id: grp_air
      sorting_weight: 50
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 0
    optimistic: true
  - platform: template
    id: manual_fan_out
