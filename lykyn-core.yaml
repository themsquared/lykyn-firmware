    name: "Air Exchange Fan Speed"
    web_server:
      sorting_group_id: grp_air
      sorting_weight: 40
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 50
    optimistic: true
    restore_value: true
  - platform: template
