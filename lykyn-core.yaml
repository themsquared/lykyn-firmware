text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_address
      name: "IP Address"
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 60
    ssid:
      id: wifi_ssid
      name: "WiFi SSID"
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 50
  - platform: template
    id: wifi_mode
    name: "WiFi Mode"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 45
    lambda: |-
      if (wifi::global_wifi_component->is_connected()) {
        return {std::string("Station")};
      }
      return {std::string("Access Point")};
    update_interval: 5s
  - platform: template
    id: installed_version
    name: "Installed Version"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 40
    lambda: 'return {std::string("${device_version}")};'
    update_interval: 60s
  - platform: template
    id: humidifier_status
    name: "Humidifier Status"
    web_server:
      sorting_group_id: grp_humidity
      sorting_weight: 15
  - platform: template
    id: air_exchange_status
    name: "Air Exchange Status"
    web_server:
      sorting_group_id: grp_air
      sorting_weight: 15
  - platform: template
    id: light_status
    name: "Light Status"
    web_server:
      sorting_group_id: grp_lights
      sorting_weight: 15
  - platform: template
    id: active_alerts
    name: "Active Alerts"
    web_server:
      sorting_group_id: grp_env
      sorting_weight: 10
  - platform: template
    id: status_json
    name: "Status JSON"
    web_server:
      sorting_group_id: grp_hidden
      sorting_weight: 10
button:
  - platform: restart
    name: "Restart"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 100
    entity_category: config
  - platform: template
    name: "LED Test"
    web_server:
      sorting_group_id: grp_lights
      sorting_weight: 90
    on_press:
      - script.execute: led_test


script:
  - id: apply_light
    mode: restart
    then:
      - lambda: |-
          if (id(led_test_running)) return;  // LED Test owns the ring until it ends
          if (!id(light_enabled).state) { id(light_status).publish_state("MANUAL"); return; }
          auto tm = id(sntp_time).now();
          if (!tm.is_valid()) return;
          // Fractional hours are honoured (the page offers quarter hours). The old
          // int cast turned 0.25 to 0.99 hours into 0 and left the ring dark.
          const float hf = tm.hour + tm.minute / 60.0f;
          const float sr = id(sunrise_hour).state;
          const float dur = id(light_hours).state;
          const bool on = dur >= 24.0f || (dur > 0.0f && fmodf(hf - sr + 48.0f, 24.0f) < dur);
          if (on) {
            const float w = id(light_white_pct).state;
            auto clamp01 = [](float v) { return v < 0 ? 0.0f : (v > 1 ? 1.0f : v); };
            auto call = id(grow_light).turn_on();
            call.set_rgb(clamp01((id(light_red_pct).state + w) / 100.0f),
                         clamp01((id(light_green_pct).state + w) / 100.0f),
                         clamp01((id(light_blue_pct).state + w) / 100.0f));
            call.set_brightness(id(light_brightness).state / 100.0f);
            call.set_transition_length(0);
            call.perform();
          } else {
            id(grow_light).turn_off().set_transition_length(0).perform();
          }
          const std::string st = on ? "ON" : "OFF";
          if (id(light_status).state != st) id(light_status).publish_state(st);
  - id: led_test
    mode: single
    then:
      - lambda: 'id(led_test_running) = true;'
      - light.turn_on: {id: grow_light, red: 100%, green: 0%, blue: 0%, brightness: 50%, transition_length: 0s}
      - delay: 2s
      - light.turn_on: {id: grow_light, red: 0%, green: 100%, blue: 0%, brightness: 50%, transition_length: 0s}
      - delay: 2s
      - light.turn_on: {id: grow_light, red: 0%, green: 0%, blue: 100%, brightness: 50%, transition_length: 0s}
      - delay: 2s
      - light.turn_on: {id: grow_light, red: 100%, green: 100%, blue: 100%, brightness: 50%, transition_length: 0s}
      - delay: 2s
      - light.turn_off: {id: grow_light, transition_length: 0s}
      - lambda: 'id(led_test_running) = false;'
      # Put the ring back to what the schedule says.
      - script.execute: apply_light

interval:
  # Climate loop, once a second. Runs locally, no cloud needed.
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t now = millis();
          const float rh = id(current_humidity).state;
          const float t = id(current_temperature).state;
          const bool fresh = (now - id(last_good_ms)) < 60000 && !isnan(rh) && !isnan(t);
          const bool smart = id(control_mode).current_option() == "SMART";
          const bool manual = id(control_mode).current_option() == "MANUAL";
          const float hum_t = id(target_humidity).state;
          const float hum_tol = id(humidity_tolerance).state;
          const float hmin = hum_t - hum_tol, hmax = hum_t + hum_tol;
          const float tt = id(temperature_target).state, ttol = id(temperature_tolerance).state;
          const float tmin = tt - ttol, tmax = tt + ttol;
          const float HARD_RH = 95.0f;   // absolute stop, whatever the setpoints say
          // Unmeasured stall floor. Stock firmware's first of four levels was 33%.
          // 0 is always off. Values above 0 are lifted to this duty until we measure the real floor.
          const float FAN_STALL_DUTY = 0.33f;
          bool want_hum = false;
          float fan_in = 0.0f, fan_out = 0.0f;
          std::string alerts;

          if (!fresh) {
            alerts = "sensor";
            if (smart || manual) { fan_in = FAN_STALL_DUTY; fan_out = FAN_STALL_DUTY; }  // keep some air moving
            id(hum_demand) = false;
            id(hum_ready) = false;
          } else if (smart) {
            if (!id(hum_ready)) {
              id(hum_ready) = true;
              if (rh < hum_t) id(hum_demand) = true;
            }
            if (rh < hmin) id(hum_demand) = true;
            else if (rh >= hum_t) id(hum_demand) = false;
            want_hum = id(hum_demand);
            const int period_s = (int) (id(fan_period_min).state * 60.0f);
            id(fan_cycle_s) = (id(fan_cycle_s) + 1) % (period_s > 0 ? period_s : 600);
            const bool run = id(fan_cycle_s) < (int) id(fan_run_s).state;
            if (rh > hmax || t > tmax) id(fan_boost) = true;
            else if (rh < hmax - 1.0f && t < tmax - 0.5f) id(fan_boost) = false;
            float level = id(fan_boost) ? 1.0f : (run ? id(fan_speed_pct).state / 100.0f : 0.0f);
            // Same stall lift as MANUAL: a running SMART fan below 33% does not spin.
            if (level > 0.0f && level < FAN_STALL_DUTY) level = FAN_STALL_DUTY;
            fan_in = fan_out = level;
            if (level > 0.0f && rh >= hmin) want_hum = false;   // do not mist against the exchange fans
          } else if (manual) {
            want_hum = id(manual_hum);
            fan_in = id(manual_fan_in).state / 100.0f;
            fan_out = id(manual_fan_out).state / 100.0f;
            if (fan_in > 0.0f && fan_in < FAN_STALL_DUTY) fan_in = FAN_STALL_DUTY;
            if (fan_out > 0.0f && fan_out < FAN_STALL_DUTY) fan_out = FAN_STALL_DUTY;
          } else {
            id(hum_demand) = false;
          }

          if (fresh) {
            if (rh >= hmax && smart) { want_hum = false; id(hum_demand) = false; }
            if (rh >= HARD_RH) { want_hum = false; id(hum_demand) = false; }
            if (rh < hmin) alerts += "rh_low,";
            if (rh > hmax) alerts += "rh_high,";
            if (t < tmin) alerts += "temp_low,";
            if (t > tmax) alerts += "temp_high,";
          }

          // Mister safety: at most 120 s of demand, then 30 s rest (stock does the same).
          if (id(hum_rest_s) > 0) { want_hum = false; id(hum_rest_s)--; }
          else if (want_hum) {
            if (++id(hum_on_run_s) >= 120) { id(hum_rest_s) = 30; id(hum_on_run_s) = 0; want_hum = false; }
          } else id(hum_on_run_s) = 0;

          // Mist level: time-proportional pulses in a 10 s window.
          id(mist_tick) = (id(mist_tick) + 1) % 10;
          const int on_s = (int) ceilf(10.0f * id(mist_level).state / 100.0f);
          const bool pulse = want_hum && id(mist_tick) < on_s;
          if (pulse != id(mister_relay).state) { if (pulse) id(mister_relay).turn_on(); else id(mister_relay).turn_off(); }

          id(fan_in_pwm).set_level(fan_in);
          id(fan_out_pwm).set_level(fan_out);
          id(fan_in_level_pct) = fan_in * 100.0f;
          id(fan_out_level_pct) = fan_out * 100.0f;

          auto pub = [](text_sensor::TextSensor *ts, const std::string &v) { if (ts->state != v) ts->publish_state(v); };
          pub(id(humidifier_status), pulse ? "ON" : (id(hum_rest_s) > 0 ? "REST" : (want_hum ? "WAIT" : "OFF")));
          pub(id(air_exchange_status), fan_in > 0.0f ? (id(fan_boost) ? "BOOST" : "ON") : "OFF");
          pub(id(active_alerts), alerts.empty() ? "none" : alerts);

  # Grow light schedule. Turn off "Light Enabled" to drive the ring by hand.
  # The ring is also redrawn the moment a light number or the switch changes,
  # so a change from the device page shows up at once instead of within 20 s.
  - interval: 20s
    then:
      - script.execute: apply_light

  # Status pixel: green ok, amber no wifi, red no sensor.
  - interval: 3s
    then:
      - lambda: |-
          const bool fresh = (millis() - id(last_good_ms)) < 60000;
          const bool wifi_ok = wifi::global_wifi_component->is_connected();
          int code = !fresh ? 1 : (!wifi_ok ? 2 : 3);
          if (code == id(last_status_rgb)) return;
          id(last_status_rgb) = code;
          auto call = id(status_pixel).turn_on();
          if (code == 1) call.set_rgb(1.0f, 0.0f, 0.0f);
          else if (code == 2) call.set_rgb(1.0f, 0.5f, 0.0f);
          else call.set_rgb(0.0f, 1.0f, 0.0f);
          call.set_brightness(0.08f);
          call.set_transition_length(0);
          call.perform();

  # One-blob JSON for the LAN API: GET /text_sensor/status_json
  - interval: 5s
    then:
      - lambda: |-
          char buf[420];
          snprintf(buf, sizeof(buf),
            "{\"temperature_c\":%.2f,\"humidity_pct\":%.2f,\"humidifier\":\"%s\",\"fan_in_pct\":%.0f,\"fan_out_pct\":%.0f,"
            "\"mode\":\"%s\",\"stage\":\"%s\",\"target_humidity\":%.1f,\"humidity_tolerance\":%.1f,"
            "\"temperature_target\":%.1f,\"temperature_tolerance\":%.1f,\"light\":\"%s\",\"alerts\":\"%s\",\"uptime_s\":%u}",
            id(current_temperature).state, id(current_humidity).state,
            id(humidifier_status).state.c_str(), id(fan_in_level_pct), id(fan_out_level_pct),
            std::string(id(control_mode).current_option()).c_str(), std::string(id(stage).current_option()).c_str(),
            id(target_humidity).state, id(humidity_tolerance).state,
            id(temperature_target).state, id(temperature_tolerance).state,
            id(light_status).state.c_str(), id(active_alerts).state.c_str(), (unsigned) (millis() / 1000));
          id(status_json).publish_state(buf);
