# Shroom Labs native firmware for the Lykyn mushroom chamber (ESP32-C3, 4MB).
# Pin map recovered from the stock 0.17.0 app image. See docs/PINMAP.md.

substitutions:
  name: lykyn
  friendly_name: Lykyn
  device_version: "0.2.0"
  # Colour order of the 16 pixel grow ring. GRB is the WS2812B default.
  # Run the "LED Test" button after the first flash to confirm (red, green, blue, white).
  led_order: GRB

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  project:
    name: shroomlabs.lykyn
    version: ${device_version}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Fans and mister start OFF. The controller turns them on once it has a good reading.
          id(fan_in_pwm).set_level(0.0f);
          id(fan_out_pwm).set_level(0.0f);
      - lambda: |-
          // One time move to the shared light scale: every light percent is a share of the
          // ring's full output (100 = full), so the master brightness is 100. An older image
          // stored the mix under a master brightness (default 60) and drove each channel at
          // value x brightness / 100. Scale the stored mix by that factor so the ring puts out
          // exactly the light it did before. The stage presets already ran at boot in the new
          // scale, so white and blue are only scaled on the Custom stage.
          if (id(light_scale_v1)) return;
          id(light_scale_v1) = true;
          const float master = id(light_brightness).state;
          if (!(master > 0.0f) || master >= 100.0f) return;
          const float k = master / 100.0f;
          const bool custom = std::string(id(stage).current_option()) == "Custom";
          auto scale = [k](number::Number *n) {
            auto c = n->make_call();
            c.set_value(roundf(n->state * k * 10.0f) / 10.0f);
            c.perform();
          };
          scale(id(light_red_pct));
          scale(id(light_green_pct));
          if (custom) {
            scale(id(light_white_pct));
            scale(id(light_blue_pct));
          }
          auto b = id(light_brightness).make_call();
          b.set_value(100.0f);
          b.perform();

esp32:
  variant: esp32c3
  board: esp32-c3-devkitm-1
  flash_size: 4MB
  partitions: partitions.csv
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

improv_serial:

captive_portal:

mdns:
  services:
    - service: _shroomlabs
      protocol: _tcp
      port: 80
      txt:
        type: lykyn_chamber
        model: Lykyn
        fw: ${device_version}
        api: "1"
        path: /api/status

time:
  - platform: sntp
    id: sntp_time
    timezone: America/Los_Angeles

i2c:
  id: bus_a
  sda: GPIO4
  scl: GPIO5
  scan: true
  frequency: 100kHz

globals:
  - id: last_good_ms
    type: uint32_t
    initial_value: '0'
  - id: hum_demand
    type: bool
    initial_value: 'false'
  # Set true after the first good humidity sample in SMART. Demand starts false
  # in RAM, so without this a reboot with RH already in the hysteresis dead
  # zone (below target, still at or above target minus tolerance) never arms.
  - id: hum_ready
    type: bool
    initial_value: 'false'
  - id: hum_on_run_s
    type: int
    initial_value: '0'
  - id: hum_rest_s
    type: int
    initial_value: '0'
  - id: mist_tick
    type: int
    initial_value: '0'
  - id: manual_hum
    type: bool
    initial_value: 'false'
  - id: fan_cycle_s
    type: int
    initial_value: '0'
  - id: fan_boost
    type: bool
    initial_value: 'false'
  - id: led_test_step
    type: int
    initial_value: '0'
  - id: led_test_running
    type: bool
    initial_value: 'false'
  - id: fan_in_level_pct
    type: float
    initial_value: '0'
  - id: fan_out_level_pct
    type: float
    initial_value: '0'
  - id: last_status_rgb
    type: int
    initial_value: '-1'
  # Set once the light mix has been moved to the shared scale, where 100 percent is the full
  # ring at full output. Older images stored the mix under a master brightness of 60.
  - id: light_scale_v1
    type: bool
    restore_value: true
    initial_value: 'false'

sensor:
  - platform: sht3xd
    address: 0x44
    i2c_id: bus_a
    update_interval: 5s
    temperature:
      id: current_temperature
      name: "Current Temperature"
      web_server:
        sorting_group_id: grp_temperature
        sorting_weight: 10
      on_value:
        - lambda: 'if (!isnan(x)) id(last_good_ms) = millis();'
    humidity:
      id: current_humidity
      name: "Current Humidity"
      web_server:
        sorting_group_id: grp_humidity
        sorting_weight: 10
  - platform: wifi_signal
    name: "WiFi Signal"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 80
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 90
    entity_category: diagnostic
  - platform: template
    id: air_exchange_fan_speed
    name: "Current Air Exchange Fan Speed"
    web_server:
      sorting_group_id: grp_air
      sorting_weight: 10
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return id(fan_in_level_pct);'

# Stock hardware: GPIO0 and GPIO6 are driven HIGH at boot and never changed by the
# stock firmware. Function unknown (see docs/PINMAP.md). We match stock.
switch:
  - platform: gpio
    pin: GPIO0
    id: aux_gpio0_high
    internal: true
    restore_mode: ALWAYS_ON
  - platform: gpio
    pin: GPIO6
    id: aux_gpio6_high
    internal: true
    restore_mode: ALWAYS_ON
  # Ultrasonic mister driver. Plain on/off at the MCU (stock firmware uses digitalWrite,
  # no PWM). Mist level is set by pulsing it (time proportional).
  - platform: gpio
    pin: GPIO10
    id: mister_relay
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: humidifier_manual
    name: "Humidifier"
    web_server:
      sorting_group_id: grp_humidity
      sorting_weight: 20
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: 'id(manual_hum) = true;'
    turn_off_action:
      - lambda: 'id(manual_hum) = false;'
  - platform: template
    id: light_enabled
    name: "Light Enabled"
    web_server:
      sorting_group_id: grp_lights
      sorting_weight: 5
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: apply_light
    on_turn_off:
      - script.execute: apply_light

output:
  # Stock uses analogWrite (LEDC, 8-bit) on GPIO3 (inlet) and GPIO1 (outlet).
  - platform: ledc
    pin: GPIO3
    id: fan_in_pwm
    frequency: 1000Hz
  - platform: ledc
    pin: GPIO1
    id: fan_out_pwm
    frequency: 1000Hz

light:
  # 16 pixel WS2812B ring, data on GPIO7 (stock: FastLED RMT, timings 250/625/375 ns).
  - platform: esp32_rmt_led_strip
    id: grow_light
    name: "Grow Light"
    web_server:
      sorting_group_id: grp_lights
      sorting_weight: 10
    pin: GPIO7
    num_leds: 16
    chipset: WS2812
    rgb_order: ${led_order}
    rmt_symbols: 48   # C3 has 2 TX channels with 48 symbols each; default 96 takes both
    default_transition_length: 0s
    # Linear output, like the stock FastLED build. The ESPHome default of 2.8 squares
    # the percentages away: brightness 60 with white 20 over blue 80 left the white
    # at under 1 percent of full output, and LED Test at 30 percent was near dark.
    # Linear plus a master brightness of 100 is what makes a light percent honest:
    # 100 is the full ring, 50 is half the output.
    gamma_correct: 1.0
  # Single status pixel, GPIO2 (stock: one Adafruit NeoPixel, RGB order).
  - platform: esp32_rmt_led_strip
    id: status_pixel
    name: "Status Pixel"
    pin: GPIO2
    num_leds: 1
    chipset: WS2812
    rgb_order: RGB
    rmt_symbols: 48
    default_transition_length: 0s
    internal: true

select:
  - platform: template
    id: control_mode
    name: "Control Mode"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 10
    options: ["SMART", "MANUAL", "OFF"]
    initial_option: "SMART"
    optimistic: true
    restore_value: true
  - platform: template
    id: stage
    name: "Stage"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 20
    options: ["Fruiting", "Pinning", "Colonization", "Custom"]
    initial_option: "Fruiting"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - lambda: |-
            // A linked profile's stage knobs win. Built-in Black Oyster numbers are
            // used only when no profile is set. Always set red and green so a leftover
            // color does not stay on. Fan 20 clamps to this chamber's 33 percent floor.
            // Built-in fallback light follows the shroomlabs.io black-oyster profile: 92 lux of white
            // and blue 80. White is 23 percent of the full ring on an ESTIMATE of 400 lux at 100
            // percent (not measured), the same number the site sends. Replace when real readings exist.
            auto setn = [](number::Number *n, float v) { auto c = n->make_call(); c.set_value(v); c.perform(); };
            auto apply = [&](float t, float tt, float h, float ht, float fan_min, float fan_s, float fan_pct,
                             float light_h, float white, float red, float green, float blue, float mist) {
              setn(id(temperature_target), t);
              setn(id(temperature_tolerance), tt);
              setn(id(target_humidity), h);
              setn(id(humidity_tolerance), ht);
              setn(id(fan_period_min), fan_min);
              setn(id(fan_run_s), fan_s);
              setn(id(fan_speed_pct), fan_pct);
              setn(id(light_hours), light_h);
              setn(id(light_white_pct), white);
              setn(id(light_red_pct), red);
              setn(id(light_green_pct), green);
              setn(id(light_blue_pct), blue);
              setn(id(mist_level), mist);
            };
            esphome::shroom_labs::StageRecipe r;
            if (id(shl_cloud).stage_recipe(x.c_str(), &r)) {
              apply(r.temperature_c,
                    (r.mask & (1u << 2)) ? r.temperature_hysteresis : 4,
                    r.humidity_percent,
                    (r.mask & (1u << 3)) ? r.humidity_hysteresis : 4,
                    r.air_exchange_period_min,
                    r.air_exchange_run_sec,
                    r.fan_speed_percent,
                    r.light_hours,
                    r.white_percent,
                    r.red_percent,
                    r.green_percent,
                    r.blue_percent,
                    (r.mask & (1u << 13)) ? r.humidifier_speed_percent : 75);
              return;
            }
            if (x == "Fruiting")          apply(18, 3, 88.5, 3.5, 10, 40, 50, 12, 23, 0, 0, 80, 75);
            else if (x == "Pinning")      apply(17, 3, 92.0, 3.0, 12, 35, 40, 12, 23, 0, 0, 80, 75);
            else if (x == "Colonization") apply(24, 4, 90.0, 4.0, 60, 15, 20, 0, 0, 0, 0, 0, 75);

number:
  - platform: template
    id: target_humidity
    name: "Target Humidity"
    web_server:
      sorting_group_id: grp_humidity
      sorting_weight: 30
    unit_of_measurement: "%"
    min_value: 30
    max_value: 95
    step: 0.5
    initial_value: 88.5
    optimistic: true
    restore_value: true
  - platform: template
    id: humidity_tolerance
    name: "Humidity Tolerance"
    web_server:
      sorting_group_id: grp_humidity
      sorting_weight: 40
    unit_of_measurement: "%"
    min_value: 1
    max_value: 15
    step: 0.5
    initial_value: 2.0
    optimistic: true
    restore_value: true
  - platform: template
    id: temperature_target
    name: "Temperature Target"
    web_server:
      sorting_group_id: grp_temperature
