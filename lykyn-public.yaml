
external_components:
  - source:
      type: local
      path: external_components
    components: [shroom_labs_cloud, lykyn_dashboard, shroom_labs_local_api]

# Public installer build. No secrets inside, safe to host. The web UI and OTA have
# no password, so this unit trusts everything on your LAN, the same as the stock
# OpenShrooly chamber. Use lykyn-provision.yaml or lykyn-home.yaml to add passwords.
packages:
  core: !include lykyn-core.yaml
  web: !include lykyn-web.yaml

wifi:
  ap:
    ssid: "Lykyn-Setup"
    password: "lykyn-setup-2026"
  power_save_mode: none

web_server:
  port: 80
  version: 3
  include_internal: false

ota:
  - platform: esphome
  - platform: web_server
