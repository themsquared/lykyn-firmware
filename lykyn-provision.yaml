
external_components:
  - source:
      type: local
      path: external_components
    components: [shroom_labs_cloud, lykyn_dashboard, shroom_labs_local_api]

# First-flash build. No WiFi credentials inside. After flashing, the Lykyn opens
# a "lykyn" setup network (captive portal), and Improv over USB also works.
packages:
  core: !include lykyn-core.yaml
  web: !include lykyn-web.yaml

wifi:
  ap:
    ssid: "Lykyn-Setup"
    password: !secret ap_password
  power_save_mode: none

web_server:
  port: 80
  version: 3
  include_internal: false
  auth:
    username: !secret web_username
    password: !secret web_password

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server
